<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nội quy lao động Sun Group</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#content">Chuyển đến nội dung</a>

  <header class="topbar">
    <div class="brand">
      <svg class="logo-sun" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <g fill="#FFC20E">
          <ellipse cx="32" cy="9" rx="6" ry="9"/>
          <ellipse cx="32" cy="55" rx="6" ry="9"/>
          <ellipse cx="9" cy="32" rx="9" ry="6"/>
          <ellipse cx="55" cy="32" rx="9" ry="6"/>
          <ellipse cx="15" cy="15" rx="6" ry="9" transform="rotate(-45 15 15)"/>
          <ellipse cx="49" cy="49" rx="6" ry="9" transform="rotate(-45 49 49)"/>
          <ellipse cx="49" cy="15" rx="6" ry="9" transform="rotate(45 49 15)"/>
          <ellipse cx="15" cy="49" rx="6" ry="9" transform="rotate(45 15 49)"/>
        </g>
        <circle cx="32" cy="32" r="11" fill="#7A4B12"/>
      </svg>
      <svg class="logo-tulip" viewBox="0 0 24 40" aria-hidden="true" focusable="false">
        <path d="M12 2 C5 10 4 20 12 26 C20 20 19 10 12 2 Z" fill="#C8102E"/>
        <rect x="11" y="25" width="2" height="13" fill="#2E7D32"/>
      </svg>
      <div class="brand-text">
        <p class="brand-course" id="courseTitle">Nội quy lao động Sun Group</p>
        <p class="brand-sub" id="courseAudience"></p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="badge" id="modeBadge"></span>
      <button type="button" class="btn btn-ghost menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="sidebar">Mục lục</button>
    </div>
  </header>

  <div class="progress" aria-label="Tiến độ học tập">
    <div class="progress-bar" id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="progress-text" id="progressText"></span>
  </div>

  <div id="appBanner" class="banner warn" role="alert" hidden></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Mục lục khóa học">
      <nav>
        <ol class="menu" id="menu"></ol>
      </nav>
    </aside>
    <main class="content" id="content" tabindex="-1"></main>
  </div>

  <footer class="navbar">
    <p class="hint" id="navHint" aria-live="polite"></p>
    <div class="nav-buttons">
      <button type="button" class="btn" id="prevBtn">&larr; Quay lại</button>
      <button type="button" class="btn btn-primary" id="nextBtn">Tiếp tục &rarr;</button>
    </div>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/scorm.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
